[defaults]
retry_files_enabled = False

# ~/.ansible/tmp (the default) lives on a Kerberized NFSv4 home mount here,
# which rejects chown() to arbitrary uids (fails with EINVAL) during
# become tasks that write root-owned files. Use a local path instead.
remote_tmp = /tmp/.ansible-remote-tmp

# fact caching
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/facts_cache

# two hours timeout
fact_caching_timeout = 7200

allow_broken_conditionals = True